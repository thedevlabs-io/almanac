<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Almanac logo">
  <!-- rounded tile background (thedevlabs.io near-black) -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#0e0e10"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="25.5" fill="none" stroke="#f4f3f1" stroke-opacity="0.07"/>

  <!-- A 5x4 heatmap: each column a week, the unbroken right-hand column the streak. -->
  <g>
    <g fill="#f47c20">
      <rect x="14.5" y="25" width="15" height="15" rx="3" opacity="0.27"/>
      <rect x="35.5" y="25" width="15" height="15" rx="3" fill="#f4f3f1" opacity="0.08"/>
      <rect x="56.5" y="25" width="15" height="15" rx="3" opacity="0.51"/>
      <rect x="77.5" y="25" width="15" height="15" rx="3" opacity="0.27"/>
      <rect x="98.5" y="25" width="15" height="15" rx="3"/>
    </g>
    <g fill="#f47c20">
      <rect x="14.5" y="46" width="15" height="15" rx="3" fill="#f4f3f1" opacity="0.08"/>
      <rect x="35.5" y="46" width="15" height="15" rx="3" opacity="0.51"/>
      <rect x="56.5" y="46" width="15" height="15" rx="3" opacity="0.27"/>
      <rect x="77.5" y="46" width="15" height="15" rx="3" opacity="0.76"/>
      <rect x="98.5" y="46" width="15" height="15" rx="3"/>
    </g>
    <g fill="#f47c20">
      <rect x="14.5" y="67" width="15" height="15" rx="3" opacity="0.51"/>
      <rect x="35.5" y="67" width="15" height="15" rx="3" opacity="0.27"/>
      <rect x="56.5" y="67" width="15" height="15" rx="3" fill="#f4f3f1" opacity="0.08"/>
      <rect x="77.5" y="67" width="15" height="15" rx="3" opacity="0.51"/>
      <rect x="98.5" y="67" width="15" height="15" rx="3"/>
    </g>
    <g fill="#f47c20">
      <rect x="14.5" y="88" width="15" height="15" rx="3" opacity="0.27"/>
      <rect x="35.5" y="88" width="15" height="15" rx="3" opacity="0.76"/>
      <rect x="56.5" y="88" width="15" height="15" rx="3" opacity="0.51"/>
      <rect x="77.5" y="88" width="15" height="15" rx="3"/>
      <rect x="98.5" y="88" width="15" height="15" rx="3"/>
    </g>
  </g>
</svg>
